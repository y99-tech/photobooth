# Builds the Windows 11 app on a real Windows machine and the phone apps, then publishes an
# easy-to-download GitHub Release: Setup.exe (installer), Portable.exe (no install), a Raspberry Pi /
# Linux zip, the Android app (.apk) and the iPhone app (.ipa, installed with xtool).
# Runs on every push that changes the app, on version tags (v1.2.3) and by hand (Actions → Run workflow).
name: Build & release

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'server/**'
      - 'public/**'
      - 'desktop/**'
      - 'scripts/**'
      - 'mobile/**'
      - 'package.json'
      - '.github/workflows/release.yml'
      - '.github/release-notes.md'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Download offline AI models (bundled into the app)
        run: node scripts/fetch-models.js --strict
      - name: Check the booth's packages are bundled
        working-directory: desktop
        shell: bash
        run: |
          node -e "const r=require('../package.json').dependencies,d=require('./package.json').dependencies;
          const ro=require('../package.json').optionalDependencies||{},dd=require('./package.json').optionalDependencies||{};const bad=Object.keys(r).filter(k=>r[k]!==d[k]).concat(Object.keys(ro).filter(k=>ro[k]!==dd[k]));
          if(bad.length){console.error('desktop/package.json dependencies out of sync: '+bad+' — run npm run sync-deps in desktop/');process.exit(1)}"
      - name: Build installer + portable app
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never
      - name: Smoke test (server starts inside the packaged app)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "desktop/dist/win-unpacked/Photobooth.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod http://localhost:8080/api/status; $ok = $true; break } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process Photobooth -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw "Photobooth did not answer on http://localhost:8080" }
          Write-Host "Booth is up on $($r.platform)"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/Photobooth-Setup-*.exe
            desktop/dist/Photobooth-Portable-*.exe
          if-no-files-found: error

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key (optional — set the ANDROID_KEYSTORE_* secrets to sign with your own key)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
          else
            # No secret yet: sign with a throw-away key so the APK still installs
            # (each build then has a different key — uninstall the old app before updating).
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass photobooth -keypass photobooth \
              -alias photobooth -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Photobooth Remote" -noprompt
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=photobooth"
              echo "ANDROID_KEY_ALIAS=photobooth"
              echo "ANDROID_KEY_PASSWORD=photobooth"
            } >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          VERSION=$(node -p "require('../../desktop/package.json').version")
          mkdir -p ../../out
          cp app/build/outputs/apk/release/app-release.apk "../../out/PhotoboothRemote-Android-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  ios:
    name: iPhone app (xtool)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xtool
        run: brew install xtool-org/tap/xtool
      - name: Build unsigned .ipa
        working-directory: mobile/ios
        run: |
          xtool dev build --ipa --configuration release
          VERSION=$(node -p "require('../../desktop/package.json').version")
          mkdir -p ../../out
          cp "$(find xtool -name '*.ipa' | head -1)" "../../out/PhotoboothRemote-iPhone-$VERSION-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/*.ipa
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Version & Raspberry Pi / Linux package
        id: v
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git archive --format=zip --prefix=photobooth/ -o "out/Photobooth-RaspberryPi-Linux-$VERSION.zip" HEAD -- . ':!desktop' ':!.github' ':!mobile' ':!hardware'
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Photobooth ${{ steps.v.outputs.version }}
          body_path: .github/release-notes.md
          make_latest: true
          files: out/*
