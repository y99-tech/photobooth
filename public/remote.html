<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0d0b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Booth Remote</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-256.png">
  <style>
    .shutter {
      width: 58vw; max-width: 280px; aspect-ratio: 1; border-radius: 50%; border: 8px solid var(--panel-2);
      background: var(--accent); color: #1b140b; font-size: 26px; font-weight: 800; display: block; margin: 18px auto; cursor: pointer;
    }
    .shutter:active { transform: scale(.94); }
    .shutter:disabled { opacity: .45; }
    .state { text-align: center; font-size: 18px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--err); margin-right: 6px; }
    .dot.on { background: var(--ok); }
    .seg { display: flex; gap: 8px; flex-wrap: wrap; }
    .seg .btn { flex: 1; }
    .hgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .hgrid div { background: var(--panel-2); border-radius: 12px; padding: 10px; font-size: 15px; }
    .hgrid b { display: block; font-size: 20px; }
    .alert { border-radius: 14px; padding: 12px 14px; margin: 10px 0; font-weight: 600; }
    .alert.warn { background: #3b2f12; color: #f5c66b; }
    .alert.error { background: #3b1717; color: #ff8a80; animation: blink 1.2s infinite; }
    @keyframes blink { 50% { opacity: .55; } }
  </style>
</head>
<body>
  <div class="page">
    <div id="login" class="card">
      <h1>📱 Booth remote</h1>
      <p class="muted">Control the photobooth from your phone over the venue Wi-Fi.</p>
      <input id="pin" class="field" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">
      <div class="row" style="margin-top:12px;justify-content:flex-start"><button class="btn primary" id="go">Connect</button></div>
      <p id="err" style="color:var(--err)"></p>
    </div>

    <div id="ctl" class="hidden">
      <div class="state"><span class="dot" id="dot"></span><span id="stateTxt">Connecting…</span></div>
      <button class="shutter" id="shoot">SHOOT</button>
      <div class="row">
        <button class="btn" data-cmd="retake">↺ Retake</button>
        <button class="btn primary" data-cmd="accept">✓ Accept</button>
        <button class="btn" data-cmd="home">⌂ Home</button>
      </div>

      <div class="card">
        <h3 style="margin-top:0">Mode</h3>
        <div class="seg" id="modes">
          <button class="btn" data-mode="single">Single</button>
          <button class="btn" data-mode="strip">4-shot</button>
          <button class="btn" data-mode="gif">GIF</button>
          <button class="btn" data-mode="boomerang">Boomerang</button>
          <button class="btn" data-mode="message">Message</button>
        </div>
        <h3>Frame</h3>
        <div class="seg" id="tpls">
          <button class="btn" data-tpl="elegant">Elegant</button>
          <button class="btn" data-tpl="polaroid">Polaroid</button>
          <button class="btn" data-tpl="minimal">Minimal</button>
          <button class="btn" data-tpl="none">None</button>
        </div>
        <h3>Camera</h3>
        <div class="seg" id="cams">
          <button class="btn" data-cam="dslr">DSLR</button>
          <button class="btn" data-cam="webcam">Webcam</button>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-top:0">Greeting on current photo</h3>
        <textarea id="greet" class="field" maxlength="160" placeholder="Type a greeting and send it to the screen"></textarea>
        <div class="row" style="justify-content:flex-start;margin-top:10px"><button class="btn" id="sendGreet">Send to screen</button></div>
      </div>

      <div id="alerts"></div>
      <div class="card" id="healthCard">
        <h3 style="margin-top:0">🩺 Booth health</h3>
        <div class="hgrid" id="health"><span class="muted">Checking…</span></div>
      </div>

      <div class="card" id="lastCard" style="display:none">
        <h3 style="margin-top:0">Latest photo</h3>
        <a id="lastLink" target="_blank"><img id="lastImg" class="photo" alt=""><video id="lastVid" class="photo hidden" autoplay loop muted playsinline></video></a>
        <div class="status" id="lastStatus" style="margin-top:10px"></div>
        <div class="row hidden" id="printRow" style="justify-content:flex-start;margin-top:10px">
          <button class="btn" data-print="1">🖨️ Print</button>
          <button class="btn" data-print="2">🖨️ Print ×2</button>
        </div>
        <div class="muted" id="printMsg" style="margin-top:8px;font-size:15px"></div>
      </div>
      <p class="muted" style="text-align:center"><a href="/gallery" style="color:var(--accent)">Open gallery</a></p>
    </div>
  </div>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  let pin = localStorage.getItem('boothPin') || '';
  let es;
  let lastId = null;

  function paperText(st) {
    if (!st || !st.enabled) return '';
    return st.paperLeft >= 0 ? `🧻 ${st.paperLeft} prints of paper left` : '';
  }

  async function send(cmd, value) {
    if (navigator.vibrate) navigator.vibrate(30);
    const r = await fetch('/api/remote', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-pin': pin },
      body: JSON.stringify({ cmd, value })
    });
    if (r.status === 401) logout();
  }

  function logout() {
    localStorage.removeItem('boothPin');
    $('#ctl').classList.add('hidden');
    $('#login').classList.remove('hidden');
    if (es) es.close();
  }

  async function login() {
    const r = await fetch('/api/remote/check', { headers: { 'x-pin': pin } });
    if (!r.ok) { $('#err').textContent = 'Wrong PIN'; return; }
    const info = await r.json();
    $('#printRow').classList.toggle('hidden', !(info.print && info.print.enabled));
    $('#printMsg').textContent = paperText(info.print);
    localStorage.setItem('boothPin', pin);
    $('#login').classList.add('hidden');
    $('#ctl').classList.remove('hidden');
    connect();
  }

  const NAMES = { attract: 'Ready — waiting for guests', live: '📸 Shooting…', review: '✍️ Guest is reviewing', shareScr: '📲 Guest is sharing' };
  function setSel(box, attr, v) {
    document.querySelectorAll(`#${box} [data-${attr}]`).forEach((b) => b.classList.toggle('sel', b.dataset[attr] === v));
  }

  function connect() {
    es = new EventSource('/api/events');
    es.onopen = () => $('#dot').classList.add('on');
    es.onerror = () => { $('#dot').classList.remove('on'); $('#stateTxt').textContent = 'Reconnecting…'; };
    es.addEventListener('state', (e) => {
      const s = JSON.parse(e.data);
      $('#stateTxt').textContent = NAMES[s.screen] || s.screen;
      $('#shoot').textContent = s.screen === 'review' ? 'RESHOOT' : 'SHOOT';
      $('#shoot').disabled = s.screen === 'live';
      setSel('modes', 'mode', s.mode);
      setSel('tpls', 'tpl', s.template);
      setSel('cams', 'cam', s.camera);
    });
    es.addEventListener('photo', (e) => {
      const p = JSON.parse(e.data);
      $('#lastCard').style.display = '';
      $('#lastImg').src = p.kind === 'video' ? '' : p.url;
      $('#lastVid').classList.toggle('hidden', p.kind !== 'video');
      $('#lastImg').classList.toggle('hidden', p.kind === 'video');
      if (p.kind === 'video') $('#lastVid').src = p.url;
      $('#printRow').dataset.kind = p.kind;
      document.querySelectorAll('[data-print]').forEach((b) => (b.disabled = p.kind !== 'photo'));
      $('#lastLink').href = '/p/' + p.id;
      lastId = p.id;
      $('#lastStatus').innerHTML = Object.entries(p.shares || {}).map(([k, s]) => `<span class="pill ${s.status}">${k}: ${s.status}</span>`).join('');
    });
    es.addEventListener('health', (e) => renderHealth(JSON.parse(e.data)));
    fetch('/api/health', { headers: { 'x-pin': pin } }).then((r) => r.json()).then(renderHealth).catch(() => {});
    es.addEventListener('print', (e) => {
      const d = JSON.parse(e.data);
      const j = d.job;
      const msg = j ? { queued: 'queued', printing: 'printing…', done: 'sent ✓', failed: 'failed: ' + j.error }[j.status] : '';
      $('#printMsg').textContent = [j ? `🖨️ Print ${msg}` : '', paperText(d)].filter(Boolean).join(' · ');
    });
  }

  // Health panel + alerts (vibrate + beep when a new problem appears).
  let lastAlerts = '';
  function renderHealth(h) {
    if (!h || !h.disk) return;
    const tile = (label, value) => `<div>${label}<b>${value}</b></div>`;
    $('#health').innerHTML = [
      tile('📷 Camera', h.camera.available ? (h.camera.battery != null ? `🔋 ${h.camera.battery}%` : 'OK') : '—'),
      tile('💾 Free space', h.disk ? `${h.disk.freeGB} GB` : '?'),
      tile('🧻 Paper', h.print.enabled ? (h.print.paperLeft >= 0 ? h.print.paperLeft : '∞') : 'off'),
      tile('☁️ Uploads', `${h.uploads.done} ✓ · ${h.uploads.queued} ⏳ · ${h.uploads.failed} ✗`),
      tile('🌡️ CPU', h.cpuTemp != null ? `${h.cpuTemp}°C` : '—'),
      tile('📸 Photos', h.photos)
    ].join('');
    $('#alerts').innerHTML = (h.alerts || []).map((a) => `<div class="alert ${a.level}">⚠️ ${a.text}</div>`).join('');
    const key = (h.alerts || []).map((a) => a.text).join('|');
    if (key && key !== lastAlerts) {
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      try {
        const ac = new AudioContext(), o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = 660; g.gain.value = 0.2; o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.3);
      } catch {}
    }
    lastAlerts = key;
  }

  async function print(copies) {
    if (!lastId) return;
    const r = await fetch('/api/remote/print/' + lastId, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-pin': pin },
      body: JSON.stringify({ copies })
    });
    if (!r.ok) $('#printMsg').textContent = '⚠️ ' + ((await r.json().catch(() => ({}))).error || 'Print failed');
  }
  document.querySelectorAll('[data-print]').forEach((b) => (b.onclick = () => print(Number(b.dataset.print))));

  $('#go').onclick = () => { pin = $('#pin').value.trim(); login(); };
  $('#pin').addEventListener('keydown', (e) => e.key === 'Enter' && $('#go').click());
  $('#shoot').onclick = () => send('shoot');
  document.querySelectorAll('[data-cmd]').forEach((b) => (b.onclick = () => send(b.dataset.cmd)));
  document.querySelectorAll('[data-mode]').forEach((b) => (b.onclick = () => send('mode', b.dataset.mode)));
  document.querySelectorAll('[data-tpl]').forEach((b) => (b.onclick = () => send('template', b.dataset.tpl)));
  document.querySelectorAll('[data-cam]').forEach((b) => (b.onclick = () => send('camera', b.dataset.cam)));
  $('#sendGreet').onclick = () => send('greeting', $('#greet').value);

  // Volume buttons of Bluetooth selfie remotes also work while this page is open.
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input, textarea')) return;
    if (['AudioVolumeUp', 'AudioVolumeDown', 'Enter', ' '].includes(e.key)) { e.preventDefault(); send('shoot'); }
  });

  if (pin) login();
})();
</script>
</body>
</html>
