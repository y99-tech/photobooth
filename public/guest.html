<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f0d0b">
  <title>Your photo</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page">
    <h1 class="serif" id="title" style="text-align:center">Your photo</h1>
    <p class="muted" id="sub" style="text-align:center;margin-top:0"></p>
    <img id="photo" class="photo" alt="Photobooth photo">
    <p id="greet" class="serif" style="font-style:italic;text-align:center;font-size:20px"></p>
    <div class="row" style="margin:16px 0">
      <a class="btn primary" id="dl" download>⬇ Save photo</a>
      <button class="btn" id="shareBtn">📤 Share…</button>
    </div>
    <div class="row" id="links"></div>
    <p class="muted" id="hint" style="text-align:center;font-size:14px">
      On iPhone: tap “Share…” → “Save Image”, or long-press the photo.
    </p>
    <div class="card">
      <h3 style="margin-top:0">More photos</h3>
      <a class="btn" href="/gallery">View the whole gallery →</a>
    </div>
  </div>
<script>
(async function () {
  const $ = (s) => document.querySelector(s);
  const id = location.pathname.split('/').pop();
  const [cfg, p] = await Promise.all([
    fetch('/api/config').then((r) => r.json()),
    fetch('/api/photos/' + id).then((r) => (r.ok ? r.json() : null))
  ]);
  $('#title').textContent = cfg.event.title;
  $('#sub').textContent = [cfg.event.subtitle, cfg.event.date, cfg.event.hashtag].filter(Boolean).join(' · ');
  if (!p) { $('#photo').replaceWith(Object.assign(document.createElement('p'), { textContent: 'Photo not found.' })); return; }
  const ext = p.url.split('.').pop();
  const noun = p.kind === 'video' ? 'boomerang' : p.kind === 'gif' ? 'GIF' : 'photo';
  document.title = cfg.event.title + ' — ' + noun;
  if (p.kind === 'video') {
    const v = Object.assign(document.createElement('video'), { src: p.url, autoplay: true, loop: true, muted: true, playsInline: true, className: 'photo' });
    $('#photo').replaceWith(v);
    $('#hint').textContent = 'On iPhone: tap “Share…” → “Save Video”.';
  } else {
    $('#photo').src = p.url;
  }
  $('#dl').href = p.url;
  $('#dl').textContent = '⬇ Save ' + noun;
  $('#dl').download = (cfg.event.title || 'photobooth').replace(/\W+/g, '-') + '-' + id + '.' + ext;
  if (p.greeting) $('#greet').textContent = '“' + p.greeting + '”' + (p.guest ? ' — ' + p.guest : '');

  const text = [p.greeting, cfg.event.hashtag].filter(Boolean).join(' ');
  const pub = p.publicUrl;

  // Native share sheet (WhatsApp, Instagram, Messenger, AirDrop…) with the actual image file.
  $('#shareBtn').onclick = async () => {
    try {
      const blob = await fetch(p.url).then((r) => r.blob());
      const file = new File([blob], 'photobooth-' + id + '.' + ext, { type: p.mime || blob.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text });
      } else if (navigator.share) {
        await navigator.share({ url: pub || location.href, text });
      } else {
        alert('Sharing is not supported here — use “Save photo”.');
      }
    } catch {}
  };

  // Link-based shares work once the photo is on public hosting.
  const shareUrl = pub || location.href;
  const links = [
    ['WhatsApp', `https://wa.me/?text=${encodeURIComponent(text + ' ' + shareUrl)}`],
    pub && ['Facebook', `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(pub)}`],
    pub && ['X', `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(pub)}`],
    pub && ['Online copy', pub]
  ].filter(Boolean);
  $('#links').innerHTML = links.map(([n, u]) => `<a class="btn ghost" target="_blank" rel="noopener" href="${u}">${n}</a>`).join('');
})();
</script>
</body>
</html>
