<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo mosaic</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/style.css">
  <style>
    html, body { background: #000; overflow: hidden; }
    #wall { position: fixed; inset: 0; display: grid; place-items: center; }
    canvas { max-width: 100vw; max-height: 100vh; }
    #fly { position: fixed; z-index: 5; border: 4px solid #fff; box-shadow: 0 10px 60px rgba(0,0,0,.7); transition: all 1.4s cubic-bezier(.6,.05,.3,1); pointer-events: none; }
    .cap { position: fixed; left: 2vw; right: 2vw; bottom: 2vh; display: flex; justify-content: space-between; align-items: flex-end; color: #fff; text-shadow: 0 2px 10px #000; }
    .qrs { background: #fff; padding: 6px; border-radius: 10px; width: 11vmin; }
    .qrs img { width: 100%; display: block; }
  </style>
</head>
<body>
  <div id="wall"><canvas id="c"></canvas></div>
  <div class="cap">
    <div><div class="serif" id="title" style="font-size:4vmin"></div><div id="count" style="font-size:2.2vmin;opacity:.85"></div></div>
    <div style="text-align:center;font-size:1.6vmin"><div class="qrs"><img src="/api/qr.svg?to=/gallery" alt=""></div><span id="scan"></span></div>
  </div>
<script src="/i18n.js"></script>
<script>
// Live mosaic: every booth photo becomes a tile; tiles are tinted towards the big picture so the
// couple's photo slowly appears as the night goes on. Same result on every reload (deterministic).
(async function () {
  const $ = (s) => document.querySelector(s);
  const cfg = await fetch('/api/config').then((r) => r.json());
  I18n.set(cfg.booth.language || 'en');
  $('#title').textContent = cfg.event.title;
  $('#scan').textContent = I18n.t('scanAll');
  const COLS = cfg.mosaic.cols || 24, ROWS = cfg.mosaic.rows || 16, TINT = cfg.mosaic.tint ?? 0.45;
  const c = $('#c'), ctx = c.getContext('2d');
  const W = 1920, H = Math.round((W * ROWS) / COLS);
  c.width = W; c.height = H;
  const cw = W / COLS, ch = H / ROWS;

  // Target picture: the uploaded couple photo, or a drawn heart with the couple's names.
  const target = document.createElement('canvas');
  target.width = COLS; target.height = ROWS;
  const tctx = target.getContext('2d', { willReadFrequently: true });
  const big = document.createElement('canvas');
  big.width = W; big.height = H;
  const bctx = big.getContext('2d');
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = '/asset/mosaic?' + Date.now(); });
    const s = Math.max(W / img.width, H / img.height);
    bctx.drawImage(img, (W - img.width * s) / 2, (H - img.height * s) / 2, img.width * s, img.height * s);
  } catch {
    const g = bctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.6);
    g.addColorStop(0, '#3a2a1c'); g.addColorStop(1, '#0d0906');
    bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);
    bctx.fillStyle = '#e23b5a';
    const hs = H * 0.9, x0 = W / 2, y0 = H * 0.12;
    bctx.beginPath();
    bctx.moveTo(x0, y0 + hs * 0.3);
    bctx.bezierCurveTo(x0, y0, x0 - hs * 0.5, y0, x0 - hs * 0.5, y0 + hs * 0.3);
    bctx.bezierCurveTo(x0 - hs * 0.5, y0 + hs * 0.6, x0, y0 + hs * 0.75, x0, y0 + hs * 0.95);
    bctx.bezierCurveTo(x0, y0 + hs * 0.75, x0 + hs * 0.5, y0 + hs * 0.6, x0 + hs * 0.5, y0 + hs * 0.3);
    bctx.bezierCurveTo(x0 + hs * 0.5, y0, x0, y0, x0, y0 + hs * 0.3);
    bctx.fill();
  }
  tctx.drawImage(big, 0, 0, COLS, ROWS);
  const tpx = tctx.getImageData(0, 0, COLS, ROWS).data;
  // Faint big picture underneath so the shape is visible from the start.
  ctx.globalAlpha = 0.18;
  ctx.drawImage(big, 0, 0);
  ctx.globalAlpha = 1;

  // Deterministic shuffled cell order (seeded by the event title).
  let seed = [...(cfg.event.title || 'x')].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) % 2147483647, 7) || 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
  const order = [...Array(COLS * ROWS).keys()];
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }

  const load = (src) => new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });

  function drawTile(img, cell) {
    const x = (cell % COLS) * cw, y = Math.floor(cell / COLS) * ch;
    const s = Math.max(cw / img.width, ch / img.height);
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, cw, ch); ctx.clip();
    ctx.drawImage(img, x + (cw - img.width * s) / 2, y + (ch - img.height * s) / 2, img.width * s, img.height * s);
    const k = cell * 4;
    ctx.globalAlpha = TINT;
    ctx.fillStyle = `rgb(${tpx[k]},${tpx[k + 1]},${tpx[k + 2]})`;
    ctx.fillRect(x, y, cw, ch);
    ctx.restore();
  }

  let placed = 0;
  const seen = new Set();
  const list = await fetch('/api/photos?public=1&kind=photo,gif&order=oldest&limit=2000').then((r) => r.json());
  function count() { $('#count').textContent = `${Math.min(placed, COLS * ROWS)} / ${COLS * ROWS}`; }
  // Draw existing photos a few at a time (images are released after drawing — low memory).
  for (const p of list) {
    seen.add(p.id);
    const img = await load(p.thumb || p.url);
    if (img) drawTile(img, order[placed % order.length]);
    placed++;
    if (placed % 20 === 0) count();
  }
  count();

  // New photos fly in big, then shrink into their tile.
  const queue = [];
  let flying = false;
  async function next() {
    if (flying || !queue.length) return;
    flying = true;
    const p = queue.shift();
    const img = await load(p.thumb || p.url);
    if (img) {
      const cell = order[placed % order.length];
      const r = c.getBoundingClientRect(), sx = r.width / W;
      const fly = document.createElement('img');
      fly.id = 'fly';
      fly.src = img.src;
      const w0 = Math.min(innerWidth, innerHeight) * 0.6, h0 = (w0 * img.height) / img.width;
      Object.assign(fly.style, { left: (innerWidth - w0) / 2 + 'px', top: (innerHeight - h0) / 2 + 'px', width: w0 + 'px', height: h0 + 'px' });
      document.body.appendChild(fly);
      await new Promise((res) => setTimeout(res, 2500));
      Object.assign(fly.style, { left: r.left + (cell % COLS) * cw * sx + 'px', top: r.top + Math.floor(cell / COLS) * ch * sx + 'px', width: cw * sx + 'px', height: ch * sx + 'px', opacity: 0.4 });
      await new Promise((res) => setTimeout(res, 1450));
      drawTile(img, cell);
      fly.remove();
      placed++;
      count();
    }
    flying = false;
    next();
  }

  const es = new EventSource('/api/events');
  es.addEventListener('photo', (e) => {
    const p = JSON.parse(e.data);
    if (!p || seen.has(p.id) || !['photo', 'gif'].includes(p.kind) || p.hidden || p.pending || p.mode === 'message') return;
    // Wait until the small preview exists (sent a moment after the photo).
    if (!p.thumb && !p._retry) { p._retry = 1; return setTimeout(() => { if (!seen.has(p.id)) { seen.add(p.id); queue.push(p); next(); } }, 2500); }
    seen.add(p.id);
    queue.push(p);
    next();
  });
})();
</script>
</body>
</html>
